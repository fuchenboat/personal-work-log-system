<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="个人工作日志管理系统 —— 日志记录、项目管理与数据看板一体化工具">
  <title>个人工作日志管理系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230b1220'/%3E%3Cpath d='M7 7.5h10M7 12h10M7 16.5h6' stroke='%2322d3ee' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 背景装饰层：网格 + 光晕 -->
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow--cyan"></div>
    <div class="bg-glow bg-glow--violet"></div>
    <div class="bg-scan"></div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand__logo" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 4h10l4 4v12a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20z"/>
            <polyline points="8,4 8,10 15,10"/>
            <path d="M8.5 14h7M8.5 17.5h4.5"/>
          </svg>
        </div>
        <div class="brand__text">
          <h1 class="brand__title">个人工作日志管理系统</h1>
          <p class="brand__sub">WORK&nbsp;LOG&nbsp;·&nbsp;CONSOLE</p>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="主导航"></nav>

      <div class="topbar__actions" id="topbarActions"></div>
    </header>

    <main class="main" id="main">
      <div class="view" id="view"></div>
    </main>
  </div>

  <!-- 轻提示容器 -->
  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <!-- 脚本加载顺序：工具 -> 种子数据 -> 数据层 -> 主框架 -> 业务视图 -->
  <script src="js/utils.js"></script>
  <script src="js/seed-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/logs.js"></script>
  <script src="js/views/projects.js"></script>
</body>
</html>
